<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#212121">
  <title>보도자료 초안 · 현장 안전점검</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/agent.css">
  <style>
    #facts { min-height: 220px; }
    #rules { min-height: 120px; }
    .release { margin: 0 0 12px; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
    .release h3 { margin: 0 0 12px; font-size: 1.125rem; line-height: 1.4; }
    .release p { margin: 0 0 10px; }
    .crit { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; }
    .crit li { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
    .crit li.fail { border-color: #fecaca; background: var(--bad-bg); }
    .crit .head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-weight: 700; }
    .crit .by { font-size: 0.75rem; color: var(--ink-soft); font-weight: 400; }
    .crit p { margin: 4px 0 0; font-size: 0.9375rem; }
    .approve { padding: 12px; border: 2px solid var(--brand); border-radius: var(--radius); margin: 0 0 12px; }
    .approve label { display: flex; gap: 10px; align-items: flex-start; min-height: 44px; font-weight: 600; }
    .approve input[type="checkbox"] { width: 24px; height: 24px; flex: none; margin: 2px 0 0; }
    .approve .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .approve .btns button.primary { width: auto; flex: 1 1 200px; }
    .list { margin: 4px 0 0; padding-left: 20px; font-weight: 400; }
  </style>
</head>
<body>
  <header>
    <div class="wrap head">
      <h1>보도자료 초안</h1>
      <a href="/">점검표로</a>
    </div>
  </header>

  <main class="wrap grid">
    <section class="card" aria-labelledby="in-title">
      <h2 id="in-title">사실·수치 입력</h2>
      <label class="lbl" for="facts">보도자료에 쓸 사실·수치</label>
      <textarea id="facts" placeholder="회사: …&#10;날짜: …&#10;내용: …"></textarea>
      <label class="lbl" for="rules" style="margin-top:12px">회사 표기 규칙</label>
      <textarea id="rules"></textarea>
      <p class="hint">예시(합성)</p>
      <div class="samples" id="samples"></div>
      <p class="hint">작성 Agent 가 초안을 쓰고, 평가 Agent 가 기준표 4개로 평가합니다. 입력에 없는 숫자와 근거 없는 과장 표현은 코드도 따로 찾습니다. 실패한 기준의 이유만 작성 Agent 에 넘겨 최대 2회 고칩니다. 게시는 하지 않으며, 승인은 사람이 누릅니다.</p>
      <button type="button" class="primary" id="run" style="margin-top:12px">초안 만들고 평가하기</button>
    </section>

    <section class="card" aria-labelledby="out-title" aria-live="polite">
      <h2 id="out-title">결과</h2>
      <div id="result"><p class="empty-state">아직 실행하지 않았습니다.</p></div>
    </section>
  </main>

  <script src="/agent-ui.js" defer></script>
  <script src="/press.js" defer></script>
</body>
</html>
