<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#212121">
  <title>입찰 우선순위 · 현장 안전점검</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/agent.css">
  <style>
    #bids { min-height: 240px; font-family: Consolas, "SF Mono", Menlo, monospace, "Malgun Gothic"; font-size: 0.8125rem; white-space: pre; overflow-x: auto; }
    #company { min-height: 140px; }
    .weights { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin: 12px 0 0; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
    @media (min-width: 768px) { .weights { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .weights legend { font-weight: 700; padding: 0 4px; }
    .weight { display: grid; grid-template-columns: 6.5em minmax(0, 1fr) 2em; align-items: center; gap: 8px; }
    .weight input { width: 100%; min-height: 44px; accent-color: var(--brand); }
    .weight output { font-weight: 700; text-align: right; }
    .rows { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 10px; }
    .bid { display: grid; grid-template-columns: 3em minmax(0, 1fr); gap: 4px 12px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
    .bid.no { background: #f9fafb; }
    .bid .rank { grid-row: span 4; font-size: 1.5rem; font-weight: 800; text-align: center; }
    .bid h3 { margin: 0; font-size: 1rem; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
    .bid .sub { margin: 0; font-size: 0.8125rem; color: var(--ink-soft); }
    .score { font-size: 1.125rem; font-weight: 800; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 0; padding: 0; list-style: none; }
    .chips li { font-size: 0.8125rem; padding: 2px 8px; border-radius: 999px; background: #f3f4f6; border: 1px solid #e5e7eb; }
    .chips li.low { background: var(--bad-bg); border-color: #fecaca; color: var(--bad); }
    .why { grid-column: 2; margin: 4px 0 0; font-size: 0.9375rem; }
    .why .caution { display: block; color: var(--warn); font-size: 0.875rem; }
    .formula { font-size: 0.8125rem; color: var(--ink-soft); margin: 0 0 12px; }
    .list { margin: 4px 0 0; padding-left: 20px; font-weight: 400; }
  </style>
</head>
<body>
  <header>
    <div class="wrap head">
      <h1>입찰 참여 우선순위</h1>
      <a href="/">점검표로</a>
    </div>
  </header>

  <main class="wrap grid">
    <section class="card" aria-labelledby="in-title">
      <h2 id="in-title">조회한 공고</h2>
      <label class="lbl" for="bids">공고 목록 (엑셀에서 표 복사·붙여넣기)</label>
      <textarea id="bids" spellcheck="false" placeholder="공고번호&#9;공고명&#9;발주기관&#9;공종&#9;지역&#9;추정가격&#9;마감일시&#9;참가자격"></textarea>
      <p class="hint">필수 칸: 공고번호·공고명·추정가격(원)·마감일시(2026-11-28 14:00). 마감이 지난 공고는 빼고, 금액 순 상위 10건만 검토합니다.</p>
      <label class="lbl" for="company" style="margin-top:12px">우리 회사 정보</label>
      <textarea id="company" placeholder="본사 소재지, 보유 면허, 주력 공종, 최근 실적"></textarea>
      <p class="hint">예시(합성)</p>
      <div class="samples" id="samples"></div>
      <fieldset class="weights" id="weights">
        <legend>가중치 (0~10, 바꾸면 순위를 바로 다시 매깁니다)</legend>
      </fieldset>
      <button type="button" class="primary" id="run" style="margin-top:12px">우선순위 정하기</button>
    </section>

    <section class="card" aria-labelledby="out-title" aria-live="polite">
      <h2 id="out-title">결과</h2>
      <div id="result"><p class="empty-state">아직 실행하지 않았습니다.</p></div>
    </section>
  </main>

  <script src="/agent-ui.js" defer></script>
  <script type="module" src="/bid.js"></script>
</body>
</html>
