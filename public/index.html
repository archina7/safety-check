<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f2a37">
  <title>현장 안전점검</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --ink: #111827;
      --ink-soft: #4b5563;
      --line: #d1d5db;
      --brand: #1f2a37;
      --accent: #f59e0b;
      --ok: #15803d;
      --ok-bg: #f0fdf4;
      --focus: #2563eb;
      --radius: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      /* 한국어는 어절 단위로 줄바꿈, 아주 긴 낱말은 넘치지 않게 끊는다 */
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .wrap {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* 상단: 제목과 진행 상황 */
    header {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--brand);
      color: #fff;
      box-shadow: 0 2px 8px rgb(0 0 0 / 0.15);
    }

    .head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px 16px;
      padding-top: 14px;
      padding-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
      line-height: 1.3;
    }

    .date {
      margin: 2px 0 0;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .count {
      margin: 0;
      font-size: 1.125rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .count strong {
      font-size: 1.75rem;
      color: var(--accent);
    }

    .count.done strong { color: #4ade80; }

    .bar {
      height: 6px;
      margin-bottom: 14px;
      border-radius: 999px;
      background: rgb(255 255 255 / 0.18);
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width 0.25s ease;
    }

    .bar.done span { background: #4ade80; }

    main.wrap { padding-top: 16px; padding-bottom: 24px; }

    .notice {
      margin: 0 0 16px;
      padding: 12px 14px;
      border-radius: var(--radius);
      background: var(--ok-bg);
      border: 1px solid #bbf7d0;
      color: var(--ok);
      font-weight: 600;
    }

    /* 점검 항목: 모바일 1열 → 태블릿 2열 → 데스크탑 3열 */
    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
    }

    @media (min-width: 768px) {
      .list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      h1 { font-size: 1.5rem; }
    }

    @media (min-width: 1280px) {
      .list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    .card {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      height: 100%;
      min-height: 44px;
      padding: 16px;
      border: 2px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s, background-color 0.15s;
    }

    .card:hover { border-color: #9ca3af; }

    /* 체크박스: 카드 전체가 누르는 영역, 눈에 보이는 상자는 28px */
    .card input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      margin: 0;
    }

    .box {
      flex: none;
      width: 28px;
      height: 28px;
      margin-top: 2px;
      border: 2px solid #6b7280;
      border-radius: 8px;
      background: #fff;
      display: grid;
      place-items: center;
    }

    .box svg { width: 18px; height: 18px; opacity: 0; }

    .card input:checked ~ .box {
      background: var(--ok);
      border-color: var(--ok);
    }

    .card input:checked ~ .box svg { opacity: 1; }

    .card:has(input:checked) {
      border-color: var(--ok);
      background: var(--ok-bg);
    }

    .card:has(input:focus-visible) {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .body { min-width: 0; flex: 1; }

    .tag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      background: #fef3c7;
      color: #92400e;
      font-size: 0.8125rem;
      font-weight: 700;
    }

    .content, .law { display: block; }

    .content {
      margin: 8px 0 6px;
      font-size: 1rem;
      font-weight: 600;
    }

    .law {
      margin: 0;
      font-size: 0.8125rem;
      color: var(--ink-soft);
    }

    .state {
      padding: 32px 16px;
      text-align: center;
      color: var(--ink-soft);
    }

    button {
      min-height: 44px;
      min-width: 44px;
      margin-top: 12px;
      padding: 0 20px;
      border: 0;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

    footer {
      padding-bottom: 32px;
      font-size: 0.8125rem;
      color: var(--ink-soft);
    }

    footer p { margin: 0; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap head">
      <div>
        <h1>오늘의 안전점검</h1>
        <p class="date" id="date"></p>
      </div>
      <p class="count" id="count" aria-live="polite">완료 <strong id="done">0</strong> / <span id="total">6</span></p>
    </div>
    <div class="wrap">
      <div class="bar" id="bar" role="progressbar" aria-label="점검 진행률" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0"><span></span></div>
    </div>
  </header>

  <main class="wrap">
    <p class="notice" id="notice" hidden>오늘 점검을 모두 마쳤습니다.</p>
    <div id="state" class="state">점검 항목을 불러오는 중입니다…</div>
    <ul class="list" id="list" hidden></ul>
  </main>

  <footer class="wrap">
    <p>예시(합성) 점검 항목입니다. 체크 기록은 이 기기의 브라우저에 날짜별로 저장됩니다.</p>
  </footer>

  <template id="item">
    <li>
      <label class="card">
        <input type="checkbox">
        <span class="box" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </span>
        <span class="body">
          <span class="tag"></span>
          <span class="content"></span>
          <span class="law"></span>
        </span>
      </label>
    </li>
  </template>

  <script>
    const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
    let items = [];
    let today = '';

    // 기기 시간 기준 오늘 날짜 (YYYY-MM-DD)
    function localDateKey(d = new Date()) {
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }

    function storageKey() { return `safety-check:${today}`; }

    function loadChecked() {
      try {
        const raw = localStorage.getItem(storageKey());
        return new Set(raw ? JSON.parse(raw) : []);
      } catch {
        return new Set();
      }
    }

    function saveChecked(set) {
      try {
        localStorage.setItem(storageKey(), JSON.stringify([...set]));
      } catch {
        // 저장 불가(사생활 보호 모드 등) — 화면 체크는 그대로 둔다
      }
    }

    function showDate() {
      const d = new Date();
      document.getElementById('date').textContent =
        `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${WEEKDAYS[d.getDay()]}요일`;
    }

    function updateCount() {
      const checked = loadChecked();
      const done = items.filter((it) => checked.has(it.id)).length;
      const total = items.length;
      const allDone = total > 0 && done === total;

      document.getElementById('done').textContent = done;
      document.getElementById('total').textContent = total;
      document.getElementById('count').classList.toggle('done', allDone);

      const bar = document.getElementById('bar');
      bar.classList.toggle('done', allDone);
      bar.setAttribute('aria-valuemax', total);
      bar.setAttribute('aria-valuenow', done);
      bar.firstElementChild.style.width = total ? `${(done / total) * 100}%` : '0';

      document.getElementById('notice').hidden = !allDone;
    }

    function render() {
      const list = document.getElementById('list');
      const tpl = document.getElementById('item');
      const checked = loadChecked();
      list.replaceChildren();

      for (const it of items) {
        const node = tpl.content.cloneNode(true);
        const input = node.querySelector('input');
        input.checked = checked.has(it.id);
        input.addEventListener('change', () => {
          const set = loadChecked();
          input.checked ? set.add(it.id) : set.delete(it.id);
          saveChecked(set);
          updateCount();
        });
        node.querySelector('.tag').textContent = it.category;
        node.querySelector('.content').textContent = it.content;
        node.querySelector('.law').textContent = `근거: ${it.law}`;
        list.append(node);
      }

      list.hidden = false;
      updateCount();
    }

    async function load() {
      const state = document.getElementById('state');
      state.hidden = false;
      state.textContent = '점검 항목을 불러오는 중입니다…';
      try {
        const res = await fetch('/api/inspections', { headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error(String(res.status));
        items = (await res.json()).items;
        state.hidden = true;
        render();
      } catch {
        state.replaceChildren(
          Object.assign(document.createElement('p'), { textContent: '점검 항목을 불러오지 못했습니다. 연결 상태를 확인해 주세요.' }),
          Object.assign(document.createElement('button'), { type: 'button', textContent: '다시 시도', onclick: load }),
        );
      }
    }

    // 날짜가 바뀐 채로 화면을 다시 열면 새 날짜의 체크 상태로 바꾼다
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && localDateKey() !== today) {
        today = localDateKey();
        showDate();
        if (items.length) render();
      }
    });

    today = localDateKey();
    showDate();
    load();
  </script>
</body>
</html>
