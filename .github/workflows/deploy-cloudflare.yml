# main에 cloudflare/ 변경이 push되면 Cloudflare Worker(safety-check-mcp)를 배포한다.
# 필요한 저장소 시크릿: CLOUDFLARE_API_TOKEN
# D1 데이터(seed.sql)는 건드리지 않는다. 초기화는 수동으로 실행한다.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: |
          npx wrangler types
          npx tsc -p .

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
